<app-table
  [rows]="usersResource.value() ?? []"
  [(page)]="page"
  [(pageSize)]="pageSize"
  [totalItems]="mockXTotalCount"
  [isLoading]="usersResource.isLoading()"
>
  <table-column header="Name" key="username"></table-column>
  <table-column header="Departments" key="departments"></table-column>
  <table-column header="Address" key="address"></table-column>
  <table-column header="Phone" key="phone">
    <ng-template appHeader>Client Phone</ng-template>
  </table-column>
  <table-column header="DOB" key="dob" [dataType]="COL_TYPE.DATE"> </table-column>
</app-table>
